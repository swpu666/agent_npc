<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<base href="/agentnpc/" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用记录 · 全部会话（管理视角）</title>
<style>
  :root{--bg:#0b1020;--panel:#141c34;--line:#26314f;--text:#e8edf9;--dim:#98a4c4;
        --cyan:#56d7e7;--amber:#f0c46a;--green:#4ade80;--red:#ff7b7b}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0b1020,#0a0e1c 60%);color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.7}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px;word-break:break-all}
  .banner{padding:10px 14px;border-radius:11px;font-size:12.5px;margin:12px 0;border:1px dashed rgba(240,196,106,.5);
    background:rgba(240,196,106,.08);color:var(--amber)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .card{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
  .card .k{font-size:11.5px;color:var(--dim)}.card .v{font-size:21px;font-weight:600;margin-top:2px}
  .toolbar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
  button{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--dim)}
  button:hover{color:var(--cyan);border-color:rgba(86,215,231,.5)}
  .item{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;margin:9px 0}
  .head{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:6px}
  .tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.intent{color:var(--cyan)}.tag.err{color:var(--red)}
  .q{color:var(--dim);font-size:12.5px;margin:3px 0}
  .a{white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.03);border-radius:9px;padding:8px 10px;margin:5px 0}
  .sid{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
  .empty{padding:26px;text-align:center;color:var(--dim)}
  @media (max-width:640px){
    .wrap{padding:16px 12px 48px}
    h1{font-size:18px}
    .cards{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .card{padding:10px 12px}
    .card .v{font-size:18px}
    .item{padding:10px 12px}
    .toolbar{gap:6px}
    button{padding:8px 14px;min-height:38px}
    .sid{word-break:break-all}
    .q{font-size:13px}
    .a{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>使用记录 · 全部会话（管理视角）</h1>
  <div class="sub">这个页面看的是 <b>所有会话</b> 的记录；玩家主页面里的「使用记录」只显示各自的。</div>

  <div class="banner">
    当前入口<b>没有鉴权</b>：任何知道这个网址的人都能看到全部记录（含 IP 与对话内容）。
    它仅用于演示「自己视角 vs 管理视角」的区分，<b>上线前必须加登录与权限校验</b>。
  </div>

  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <button id="btn-refresh">刷新</button>
    <span class="sid" id="meta"></span>
  </div>
  <div id="list"></div>
</div>

<script>
(function () {
  var INTENT = { knowledge_qa: "知识", situational_advice: "情境", chitchat: "闲聊", out_of_scope: "越界", "(invalid)": "非法" };
  var ROUTE = { need_more_info: "需补充条件", kb_miss: "未收录", kb_gap: "未覆盖", unclear_input: "没听懂" };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderCards(stats) {
    var wrap = document.getElementById("cards");
    wrap.innerHTML = "";
    var rows = [
      ["总记录数", stats.total || 0],
      ["独立 IP", stats.unique_ips || 0],
      ["错误数", stats.errors || 0],
      ["Mock 数", stats.mock || 0],
      ["平均耗时", (stats.avg_total_ms || 0) + "ms"]
    ];
    rows.forEach(function (r) {
      var c = el("div", "card");
      c.appendChild(el("div", "k", r[0]));
      c.appendChild(el("div", "v", String(r[1])));
      wrap.appendChild(c);
    });
  }

  function renderItem(r) {
    var item = el("div", "item");
    var head = el("div", "head");
    head.appendChild(el("span", "tag", String(r.ts || "").replace("T", " ").slice(0, 19)));
    head.appendChild(el("span", "tag", "IP " + (r.ip || "-")));
    head.appendChild(el("span", "tag", "会话 " + (r.session_id || "-")));
    head.appendChild(el("span", "tag intent", INTENT[r.intent] || r.intent || "?"));
    if (r.route_state) head.appendChild(el("span", "tag", ROUTE[r.route_state] || r.route_state));
    var t = r.timings || {};
    head.appendChild(el("span", "tag", (t.total_ms || 0) + "ms"));
    if (r.error) head.appendChild(el("span", "tag err", "错误 " + r.error));
    item.appendChild(head);
    item.appendChild(el("div", "q", "问：" + (r.message || "")));
    if (r.answer) item.appendChild(el("div", "a", r.answer));
    if (r.citations && r.citations.length) {
      item.appendChild(el("div", "sid", "引用：" + r.citations.join("、" )));
    }
    return item;
  }

  function load() {
    var meta = document.getElementById("meta");
    var list = document.getElementById("list");
    meta.textContent = "加载中…";
    list.innerHTML = "";
    fetch("api/logs/stats")
      .then(function (r) { return r.json(); })
      .then(renderCards)
      .catch(function () {});
    fetch("api/logs/all?limit=200")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.enabled) {
          meta.textContent = "使用记录已关闭（LOG_ENABLED=0）";
          list.appendChild(el("div", "empty", "后端已关闭使用记录写入。"));
          return;
        }
        var records = d.records || [];
        meta.textContent = records.length + " 条 · " + d.log_dir;
        if (!records.length) {
          list.appendChild(el("div", "empty", "暂无记录。"));
          return;
        }
        records.forEach(function (r) { list.appendChild(renderItem(r)); });
      })
      .catch(function () {
        meta.textContent = "读取失败";
        list.appendChild(el("div", "empty", "无法读取使用记录，请确认服务仍在运行。"));
      });
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
